# MySQL configuration for the local Docker lab
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DB:booksDb}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.platform=mysql
spring.sql.init.mode=always
server.address=0.0.0.0

# Readiness only becomes UP after application startup and a working database connection.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
