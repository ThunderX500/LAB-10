apiVersion: v1
kind: Service
metadata:
  name: booksserver
  labels:
    app: booksserver
spec:
  type: ClusterIP
  selector:
    app: booksserver
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booksserver
  labels:
    app: booksserver
spec:
  # Two replicas so the pod replacement test has a pod to spare.
  replicas: 2
  selector:
    matchLabels:
      app: booksserver
  template:
    metadata:
      labels:
        app: booksserver
    spec:
      containers:
        - name: booksserver
          image: books-rest-api:latest
          # The image is side-loaded with "minikube image load", so never
          # go looking for it on Docker Hub.
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: [ "sh", "-c", "sleep 5" ]
          ports:
            - containerPort: 8080
          env:
            - name: MYSQL_DB
              value: booksDb
            # Resolved by the headless mysql service above.
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PASSWORD
              value: root
            - name: MYSQL_USER
              value: root
