apiVersion: v1
kind: Service
metadata:
  name: booksserver
  labels:
    app: booksserver
spec:
  type: ClusterIP
  selector:
    app: booksserver
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booksserver
  labels:
    app: booksserver
spec:
  # Initialize the database with one server, then scale to two for Q6.
  replicas: 1
  selector:
    matchLabels:
      app: booksserver
  template:
    metadata:
      labels:
        app: booksserver
    spec:
      initContainers:
        - name: wait-for-mysql
          image: mysql:9
          command: ["sh", "-c"]
          args:
            - until mysql --protocol=TCP -h mysql -uroot -proot -D booksDb -e 'SELECT 1'; do sleep 3; done
      containers:
        - name: booksserver
          image: books-rest-api:latest
          # The image is side-loaded with "minikube image load", so never
          # go looking for it on Docker Hub.
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: [ "sh", "-c", "sleep 5" ]
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          env:
            - name: MYSQL_DB
              value: booksDb
            # Resolved by the headless mysql service above.
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PASSWORD
              value: root
            - name: MYSQL_USER
              value: root
