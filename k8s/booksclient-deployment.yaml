apiVersion: v1
kind: Service
metadata:
  name: booksapp
  labels:
    app: booksapp
spec:
  type: ClusterIP
  selector:
    app: booksapp
  ports:
    - protocol: TCP
      port: 4100
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booksapp
  labels:
    app: booksapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booksapp
  template:
    metadata:
      labels:
        app: booksapp
    spec:
      containers:
        - name: booksapp
          image: books-api-client:latest
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: [ "sh", "-c", "sleep 5" ]
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /assets/env.json
              port: 80
            periodSeconds: 5
          env:
            # Read by the browser, not by the pod, so it points at the local
            # port-forward of the booksserver service.
            - name: API_URL
              value: http://localhost:8080/books-api/
