services:
  mysql:
    image: mysql:9
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: booksDb
    networks:
      - mysql-network
    healthcheck:
      test: ["CMD", "mysql", "--protocol=TCP", "-h", "127.0.0.1", "-uroot", "-proot", "-D", "booksDb", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    ports:
      - "3306:3306"

  booksserver:
    build:
      context: ../books-rest-api
      dockerfile: Dockerfile
    image: books-rest-api:latest
    environment:
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: booksDb
      MYSQL_HOST: mysql
    networks:
      - mysql-network
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  booksapp:
    build:
      context: ../bookstore-client
      dockerfile: Dockerfile
    image: books-api-client:latest
    environment:
      API_URL: "http://localhost:8080/books-api/"
    ports:
      - "4100:80"
    depends_on:
      mysql:
        condition: service_healthy
      booksserver:
        condition: service_healthy

networks:
  mysql-network:

volumes:
  mysql-data:
