server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Support direct navigation to Angular routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /assets/env.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}
